name: 自动打包 / 发布

# 自动化目标：改完代码只 push 一次，剩下的全自动。
#   push 到 main  → 校验仓库里的「模板 APK」→ 发布 Release（tag「{versionCode}-{versionName}」，
#                    已存在就覆盖资产）→ 同步到 Vector / LSPosed 模块发布仓库
#   push tag      → 同上，Release 用该 tag
#   手动触发 / PR → 只做校验 + 编译验证，不发布、不同步
#
# ★ 发布包是谁：仓库根目录里的 `fanqie-enhance-v{versionName}.apk`，
#   也就是开发者本地跑 module/build_local.sh 构建、真机验证通过后提交进来的那一份。
#   CI 不会拿自己现场编译的产物去发布 —— CI 用的是 runner 自带的官方 android.jar，
#   d8 在拿到完整 java.* 桩时会选不同的等价编码（filled-new-array / invokeinterface …），
#   产物字节与本地那份对不上。所以 CI 的编译只作为「源码还能编过」的验证，
#   产物叫 ci-rebuild-*.apk，只进 workflow artifact，不发布。
#   发新版前必须先把本地构建并真机验证过的 APK 提交进仓库，否则本工作流会在
#   「校验发布包」这步直接失败（这是故意的，宁可失败也不发出一个没人验证过的包）。
#
# 需要的 secrets（Settings → Secrets and variables → Actions）：
#   MODULE_KEYSTORE_BASE64  模块签名 keystore（/data/local/tmp/fuck_andes/module/module.keystore）的 base64
#                           ★ 只用于给上面的编译验证产物签名（那份不发布），
#                             缺了不影响发布 —— 发布包自带签名，来自仓库里的模板 APK
#   RELEASE_REPO_TOKEN      对 Xposed-Modules-Repo/com.eta.fanqie.enhance 有写权限的 PAT（可选）
#                           配了就会同步发布仓库的文件并建对应的 Release
#
# 生成 base64：  base64 -w0 module.keystore    (Windows: git-bash 里同上)

on:
  push:
    branches: [main]
    tags: ['v*', '*-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 只兜底用：优先拿 runner 自带的 Android SDK，取不到才下这个官方 platform 包
  ANDROID_PLATFORM_ZIP: platform-34-ext7_r03.zip
  RELEASE_REPO: Xposed-Modules-Repo/com.eta.fanqie.enhance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 只要一个 android.jar 给 javac / d8 当编译目标。
      # ubuntu runner 镜像自带 Android SDK（含 android-34），所以优先直接用现成的，零下载最稳；
      # 取不到才去 dl.google.com 拉官方 platform 包 —— 注意 Google 偶尔会返回非 zip 的错误页，
      # 所以这里先 unzip -t 校验，避免又出现 "End-of-central-directory signature not found"。
      - name: 准备 android.jar（javac / d8 的编译目标）
        run: |
          set -euo pipefail
          AJ=""
          for base in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$base" ] || continue
            if [ -s "$base/platforms/android-34/android.jar" ]; then
              AJ="$base/platforms/android-34/android.jar"
              break
            fi
          done
          if [ -z "$AJ" ]; then
            echo "runner 没有预装 android-34，改为下载官方 platform 包"
            curl -fsSL --retry 3 -o platform.zip \
              "https://dl.google.com/android/repository/${ANDROID_PLATFORM_ZIP}"
            unzip -tq platform.zip > /dev/null
            unzip -o -q platform.zip "*/android.jar" -d plat
            AJ="$PWD/$(find plat -name android.jar | head -1)"
          fi
          test -s "$AJ"
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          ls -la "$AJ"

      - name: 下载构建依赖（r8 / apksig / bouncycastle）
        run: |
          set -euo pipefail
          mkdir -p deps
          curl -fsSLo deps/r8.jar     https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
          curl -fsSLo deps/apksig.jar https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.5.2/apksig-8.5.2.jar
          curl -fsSLo deps/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar
          curl -fsSLo deps/bcpkix.jar https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-jdk18on/1.79/bcpkix-jdk18on-1.79.jar
          ls -la deps

      - name: 读取版本号 / 计算 tag
        id: ver
        run: |
          set -euo pipefail
          VN=$(python3 -c "import re;print(re.search(r'versionName=\"([^\"]+)\"',open('module/AndroidManifest.xml',encoding='utf-8').read()).group(1))")
          VC=$(python3 -c "import re;print(re.search(r'versionCode=\"(\d+)\"',open('module/AndroidManifest.xml',encoding='utf-8').read()).group(1))")
          # 统一用 v{versionName} 作为发布 tag（不再按触发方式二选一）。
          # 以前 tag 触发时用 ref 名、main 触发时用 {versionCode}-{versionName}，
          # 结果同一次发版会产出两个 Release（v1.9.30 与 193000-1.9.30），
          # 而且两个的说明都是自动生成的空壳。
          #
          # ⚠️ 但发布仓库（Xposed-Modules-Repo）必须用 **{versionCode}-{versionName}**！
          #    那个组织有自动化校验，Release 的 tag 不符合 `数字-版本号` 格式时，
          #    会在创建/更新后 ~20 秒把它**静默转回草稿**（published_at 保留，看起来像成功了）。
          #    实测：tag=v1.9.30 时每次转正都被打回、/releases/latest 一直停在旧版；
          #    改成 193000-1.9.30 后立刻稳定。所以两个仓库用两个 tag，见 rel_tag。
          TAG="v${VN}"
          REL_TAG="${VC}-${VN}"
          echo "versionName=$VN"  >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "rel_tag=$REL_TAG"  >> "$GITHUB_OUTPUT"
          echo "apk=fanqie-enhance-v$VN.apk" >> "$GITHUB_OUTPUT"
          echo "版本 $VN ($VC) → 主仓 tag $TAG / 发布仓 tag $REL_TAG，发布包 = fanqie-enhance-v$VN.apk（仓库里的模板）"

      # 发布包就是仓库里那份模板 APK。这里做三道校验，任何一道不过就直接失败：
      #   1. 文件存在（发新版忘了提交本地构建的 APK → 在这里拦住）
      #   2. 二进制清单里的 versionName/versionCode 与 module/AndroidManifest.xml 完全一致
      #      （防止提交了旧版本 / 手改错的包）
      #   3. 有 classes.dex + v1 签名块（用户要能覆盖安装）
      - name: 校验发布包（仓库模板 APK）
        run: |
          set -euo pipefail
          APK="${{ steps.ver.outputs.apk }}"
          VN="${{ steps.ver.outputs.versionName }}"
          VC="${{ steps.ver.outputs.versionCode }}"

          if [ ! -f "$APK" ]; then
            echo "::error::找不到发布包 $APK"
            echo "::error::本仓库发布的是「仓库里那份真机验证过的 APK」，不是 CI 现场编译的产物。"
            echo "::error::请先在本地跑 module/build_local.sh，真机验证通过后把它提交进仓库（文件名必须是 $APK），再发版。"
            exit 1
          fi

          python3 tools/apkver.py "$APK" --expect-name "$VN" --expect-code "$VC"

          unzip -l "$APK" | tee /tmp/tpllist.txt
          grep -q "classes.dex" /tmp/tpllist.txt \
            || { echo "::error::$APK 里没有 classes.dex"; exit 1; }
          grep -q "AndroidManifest.xml" /tmp/tpllist.txt \
            || { echo "::error::$APK 里没有 AndroidManifest.xml"; exit 1; }
          grep -qE 'META-INF/.*\.(RSA|DSA|EC)' /tmp/tpllist.txt \
            || { echo "::error::$APK 没有 v1 签名块，用户无法覆盖安装"; exit 1; }
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -E "com\.xs\.fm" || true

          echo "--- 签名证书（必须与历史版本一致，否则老用户覆盖安装会签名冲突）---"
          # 强制英文输出，免得 keytool 跟着 runner 的 locale 变（中文 JDK 打的是「所有者:」）
          keytool -J-Duser.language=en -printcert -jarfile "$APK" | grep -E "SHA256:" || true

      - name: 准备签名密钥（只给下面的编译验证产物用）
        id: ks
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/module.keystore"
          if [ -n "${{ secrets.MODULE_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.MODULE_KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            test -s "$KS"
            echo "official=true" >> "$GITHUB_OUTPUT"
            echo "✅ 编译验证产物将用仓库密钥签名"
          else
            keytool -genkeypair -keystore "$KS" -alias module -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=FanqieEnhance-CI" > /dev/null 2>&1
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 MODULE_KEYSTORE_BASE64，编译验证产物用临时密钥签名（不影响发布，发布包来自仓库模板）"
          fi

      # 只验证「源码还能编过」，产物不发布。显式指定 TEMPLATE_APK = 本次要发布的那份，
      # 保证编译验证的输入与发布产物同源。
      - name: 构建模块 APK（仅验证源码可编译，不作发布包）
        run: |
          set -euo pipefail
          export WORK="$RUNNER_TEMP/build"
          export OUT_DIR="$PWD"
          export R8_JAR="$PWD/deps/r8.jar"
          export APKSIG_JAR="$PWD/deps/apksig.jar"
          export BCPROV_JAR="$PWD/deps/bcprov.jar"
          export BCPKIX_JAR="$PWD/deps/bcpkix.jar"
          export KEYSTORE="$RUNNER_TEMP/module.keystore"
          export TEMPLATE_APK="$PWD/${{ steps.ver.outputs.apk }}"
          bash module/build_local.sh
          mv module-local.apk "ci-rebuild-${{ steps.ver.outputs.versionName }}.apk"
          echo "--- 编译验证产物（不发布，仅作对比）---"
          sha256sum "ci-rebuild-${{ steps.ver.outputs.versionName }}.apk"
          echo "--- 实际发布包（仓库模板）---"
          sha256sum "${{ steps.ver.outputs.apk }}"

      - name: 生成发布校验文件
        run: |
          set -euo pipefail
          APK="${{ steps.ver.outputs.apk }}"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-enhance-${{ steps.ver.outputs.versionName }}
          path: |
            ${{ steps.ver.outputs.apk }}
            ${{ steps.ver.outputs.apk }}.sha256
            ci-rebuild-${{ steps.ver.outputs.versionName }}.apk
          if-no-files-found: error

      # 注意：不能用 secrets 做 step 级 if（GitHub 会报 Unrecognized named-value: 'secrets'），
      #       所以这里用 if 判 ref、在脚本里判 secret 是否为空。
      - name: 发布到主仓库 Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.ver.outputs.apk }}"
          TAG="${{ steps.ver.outputs.tag }}"
          VN="${{ steps.ver.outputs.versionName }}"
          NOTES="RELEASE_NOTES_v${VN}.md"
          BODY=""
          if [ -f "$NOTES" ]; then BODY=$(cat "$NOTES"); fi

          # ⚠️ 三条必须遵守的规则，全部实测复现过：
          #  ① `GET/PATCH repos/{repo}/releases/tags/{tag}` **不返回草稿**，而且这个端点
          #     没有 PATCH 语义（改 Release 必须用 release id）。以前那句「强制转正」一直是
          #     404 被 `|| true` 吞掉，所以从来没生效过。
          #  ② `gh release create --target main` 在 tag 已存在时会把 Release 建成**草稿**。
          #  ③ 主仓对 tag 格式没有限制（v1.9.30 正常），但**发布仓库有**（必须 193000-1.9.30），
          #     详见下面「同步模块发布仓库」步骤的说明 —— 那里的 Release 会被静默打回草稿。
          #     为了两边行为一致，这里草稿态一律「删掉重建」而不是 PATCH 转正。
          state() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "map(select(.tag_name==\"${TAG}\")) | .[0] | \"\(.id) \(.draft)\"" 2>/dev/null || echo ""
          }
          read -r RID RDRAFT <<< "$(state)"
          if [ "${RID:-null}" = "null" ]; then RID=""; RDRAFT=""; fi

          if [ -n "$RID" ] && [ "${RDRAFT}" = "true" ]; then
            echo "Release $TAG 处于草稿态 (id=$RID) → 删除后以 published 重建"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RID}" > /dev/null
            RID=""
          fi

          if [ -n "$RID" ]; then
            echo "Release $TAG 已发布 (id=$RID) → 覆盖资产 + 同步说明"
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RID}" \
              -f name="v${VN}" -f body="$BODY" -F draft=false -F make_latest=true > /dev/null
          else
            echo "Release $TAG 不存在 → POST 直接创建为 published"
            if [ -n "$BODY" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$TAG" -f target_commitish=main -f name="v${VN}" \
                -f body="$BODY" -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$TAG" -f target_commitish=main -f name="v${VN}" \
                -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            fi
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          fi

          # 收尾自检：最终必须真的是 published，否则让这次 CI 红
          FINAL=$(state)
          echo "最终状态 (id draft): ${FINAL}"
          case "$FINAL" in
            *" true") echo "::error::Release $TAG 仍是草稿"; exit 1 ;;
          esac

      - name: 同步模块发布仓库（Vector / LSPosed）
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::未配置 RELEASE_REPO_TOKEN，跳过同步发布仓库"
            exit 0
          fi
          APK="${{ steps.ver.outputs.apk }}"
          VER="${{ steps.ver.outputs.versionName }}"
          # ⚠️ 发布仓必须用 {versionCode}-{versionName} 格式的 tag（见上面「读取版本号」步骤的说明）
          TAG="${{ steps.ver.outputs.rel_tag }}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" rel
          # 发布仓库只保留当前版本 APK，历史版本由 Releases 承载
          rm -f rel/fanqie-enhance-v*.apk rel/*.sha256 rel/Fanqie-Purify_v*.apk
          cp "$APK" "$APK.sha256" rel/
          # 源码/清单也要一起同步：发布仓库的根目录布局（Xposed-Modules-Repo 约定）
          # 就是 module/ 的内容。以前这里只 cp 了 APK + README，导致根目录的
          # AndroidManifest.xml / src 永远停在旧版本，和 APK 版本对不上。
          cp module/AndroidManifest.xml rel/
          cp module/build.sh module/build_local.sh rel/
          rsync -a --delete module/src/ rel/src/
          rsync -a --delete module/assets/ rel/assets/
          rsync -a --delete --exclude .git module/ rel/module/
          cp CHANGELOG.md README.md rel/ 2>/dev/null || true
          # 发行说明也一起带过去：发布仓根目录历来存着各版本 RELEASE_NOTES_vX.Y.Z.md
          cp RELEASE_NOTES_v*.md rel/ 2>/dev/null || true
          rsync -a --delete tools/ rel/tools/
          cd rel
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "release: v${VER}（自动同步）" || echo "无变更可提交"
          git push
          cd ..

          # 发布仓库的 Release：资产名沿用历史约定 Fanqie-Purify_vX.Y.Z.apk，附带同名 .sha256
          #
          # ⚠️ 踩过的坑（全部实测复现）：
          #  ① `gh release create --target main` 在 tag 已存在时会把 Release 建成**草稿**；
          #  ② `GET/PATCH .../releases/tags/{tag}` 不返回草稿，且没有 PATCH 语义（必须用 id）；
          #  ③ **真正的大坑**：这个组织要求 tag 是 `{versionCode}-{versionName}`（193000-1.9.30）。
          #     用 `v1.9.30` 这种格式时，任何一次写入（创建/上传资产/PATCH）之后约 20 秒，
          #     Release 都会被**静默转回草稿**，published_at 却保留着 ——
          #     表现就是「刚发布成功，过一会儿 /releases/latest 又退回旧版本」，怎么修都修不好。
          #     换成 193000-1.9.30 后立刻稳定，所以下面 TAG 取的是 rel_tag。
          #  ④ 兜底：草稿态不要试图 PATCH 转正（会被 ③ 打回），直接删掉用 POST 重建。
          cp "$APK" "Fanqie-Purify_v${VER}.apk"
          ASSET="Fanqie-Purify_v${VER}.apk"
          sha256sum "$ASSET" > "$ASSET.sha256"
          NOTES_FILE="RELEASE_NOTES_v${VER}.md"
          BODY=""
          if [ -f "$NOTES_FILE" ]; then BODY=$(cat "$NOTES_FILE"); fi

          state() {
            gh api "repos/${RELEASE_REPO}/releases?per_page=100" \
              --jq "map(select(.tag_name==\"${TAG}\")) | .[0] | \"\(.id) \(.draft)\"" 2>/dev/null || echo ""
          }
          read -r RID RDRAFT <<< "$(state)"
          if [ "${RID:-null}" = "null" ]; then RID=""; RDRAFT=""; fi

          if [ -n "$RID" ] && [ "${RDRAFT}" = "true" ]; then
            echo "Release $TAG 处于草稿态 (id=$RID) → 删除后以 published 重建"
            gh api -X DELETE "repos/${RELEASE_REPO}/releases/${RID}" > /dev/null
            RID=""
          fi

          if [ -n "$RID" ]; then
            echo "Release $TAG 已发布 (id=$RID) → 覆盖资产 + 同步说明"
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$RELEASE_REPO" --clobber
            gh api -X PATCH "repos/${RELEASE_REPO}/releases/${RID}" \
              -f name="v${VER}" -f body="$BODY" -F draft=false -F make_latest=true > /dev/null
          else
            echo "Release $TAG 不存在 → POST 直接创建为 published"
            if [ -n "$BODY" ]; then
              gh api -X POST "repos/${RELEASE_REPO}/releases" \
                -f tag_name="$TAG" -f target_commitish=main -f name="v${VER}" \
                -f body="$BODY" -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            else
              gh api -X POST "repos/${RELEASE_REPO}/releases" \
                -f tag_name="$TAG" -f target_commitish=main -f name="v${VER}" \
                -F draft=false -F prerelease=false -f make_latest=true > /dev/null
            fi
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$RELEASE_REPO" --clobber
          fi

          # 收尾自检：最终必须真的是 published，否则让这次 CI 红
          FINAL=$(state)
          echo "最终状态 (id draft): ${FINAL}"
          case "$FINAL" in
            *" true") echo "::error::${RELEASE_REPO} 的 Release $TAG 仍是草稿"; exit 1 ;;
          esac
          echo "✅ ${RELEASE_REPO} Release ${TAG} 已发布并标为 latest"
